name: Docker publish

on:
  push:
    branches:
      - main
    tags:
      - v*
  workflow_dispatch:
    inputs:
      reskate_release:
        description: ReSkate release tag (latest or vX.Y.Z)
        required: false
        default: latest
        type: string
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve ReSkate release
        id: reskate
        env:
          INPUT_RELEASE: ${{ github.event.inputs.reskate_release }}
        run: |
          if [ -n "${INPUT_RELEASE}" ]; then
            release="${INPUT_RELEASE}"
          else
            release="latest"
          fi
          repo="https://github.com/Dingo-Shenanigans/ReSkate"
          if [ "${release}" = "latest" ]; then
            base="${repo}/releases/latest/download"
          else
            base="${repo}/releases/download/${release}"
          fi
          curl -fsSL -o launcher.json "${base}/launcher.json"
          version="$(jq -r '.server_linux.version // empty' launcher.json)"
          if [ -z "${version}" ]; then
            echo "No server_linux version in launcher.json for release=${release}" >&2
            exit 1
          fi
          echo "release=${release}" >> "${GITHUB_OUTPUT}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.reskate.outputs.version }}
            type=raw,value=latest,enable=${{ github.event_name != 'pull_request' }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            RESKATE_RELEASE=${{ steps.reskate.outputs.release }}
            IMAGE_SOURCE=https://github.com/${{ github.repository }}
